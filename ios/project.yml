name: PukupukuAquarium
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PukupukuAquarium:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishiishikou.pukupukuaquarium
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ぷくぷく水槽"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "2QA6W85W3D"
        CODE_SIGN_STYLE: Automatic
  PukupukuAquariumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PukupukuAquarium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ishiishikou.pukupukuaquarium.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PukupukuAquarium:
    build:
      targets:
        PukupukuAquarium: all
    run:
      config: Debug
    test:
      targets:
        - PukupukuAquariumTests
