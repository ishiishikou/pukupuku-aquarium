name: PukupukuAquarium
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PukupukuAquarium:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.pukupuku-aquarium
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ぷくぷく水槽"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
schemes:
  PukupukuAquarium:
    build:
      targets:
        PukupukuAquarium: all
    run:
      config: Debug
