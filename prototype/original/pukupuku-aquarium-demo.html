function sound(wet){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.setValueAtTime(wet?440:325,now);osc.frequency.exponentialRampToValueAtTime(wet?700:470,now+.09);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.10,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+.13);filter.type='lowpass';filter.frequency.value=1250;osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+.14)}catch{}}
function tactile(){if(navigator.vibrate){try{navigator.vibrate(9)}catch{}}}
function bubble(el){const ring=document.createElement('span');ring.className='ripple';el.append(ring);setTimeout(()=>ring.remove(),480);for(let j=0;j<4;j++){const b=document.createElement('span');b.className='bubble';let size=5+Math.random()*7;b.style.width=size+'px';b.style.height=size+'px';b.style.left=(24+Math.random()*54)+'%';b.style.top=(57+Math.random()*26)+'%';b.style.setProperty('--dx',(-28+Math.random()*55)+'px');b.style.animationDelay=(j*34)+'ms';el.append(b);setTimeout(()=>b.remove(),700)}}
function tap(i,force){if(solved)return;const type=force||mode;history.push(states.slice());states[i]=states[i]===type?'':type;sound(type==='wet');tactile();bubble($('cell-'+i));render();if(!solved)$('status').textContent=states[i]==='wet'?'ぷくっ！水が入りました。':states[i]==='dry'?'ぽこっ！ここには水を入れません。':'マスを未確定に戻しました。'}
function finish(){solved=true;$('celeb').classList.add('visible');$('next').style.display='block';$('hint').disabled=true;$('status').textContent='正解！ 水槽の水位もぴったり。次の問題へ進めます。';toast('✨ クリア！ ぷくぷく、お見事！');sound(true);if((level+1)%3===0)swimmer();localStorage.setItem('pukupuku-cleared-'+level,'true')}
function showRules(intro){$('modalTitle').textContent='遊び方';$('modalBody').innerHTML='<p><b>①</b> 左と上の数字は、その行・列で水が入るマスの数です。</p><p><b>②</b> 同じ色枠は1つの水槽。<b>水は下から上へたまり、水面は水平</b>になります。同じ水槽の同じ高さのマスは、すべて水か、すべて空です。</p><p><b>③</b> 「水」か「×」を選んで各マスをタップ。すべて正しく埋めるとクリア。間違ってもペナルティはありません。</p><p><b>ヒント：</b> 数字が0の行・列は全部×。完成した行・列の数字は緑に変わります。</p>';$('closeModal').textContent='遊び始める';$('overlay').classList.add('open');if(intro)localStorage.setItem('pukupuku-intro','yes')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2200)}
function swimmer(){const a=document.createElement('span');a.className='swimmer';a.textContent=(Math.random()<.5?'🐋':'🐢');$('ocean').append(a);setTimeout(()=>a.remove(),12300)}
$('modeWater').onclick=()=>{mode='wet';updateMode();sound(true);tactile()};$('modeDry').onclick=()=>{mode='dry';updateMode();sound(false);tactile()};
$('undo').onclick=()=>{if(!history.length){toast('まだ戻す操作がありません');return}states=history.pop();solved=false;$('celeb').classList.remove('visible');$('next').style.display='none';$('hint').disabled=false;render();$('status').textContent='1手戻しました。';tactile()};
$('reset').onclick=()=>{if(states.every(x=>x==='')){toast('盤面はまだ空です');return}if(!confirm('この問題を最初からやり直しますか？'))return;states.fill('');history=[];solved=false;$('celeb').classList.remove('visible');$('next').style.display='none';$('hint').disabled=false;render();$('status').textContent='最初からやり直しました。'};
$('hint').onclick=()=>{if(solved)return;const p=puzzle();let ids=states.map((v,i)=>v===''?i:-1).filter(i=>i>=0);if(!ids.length){ids=states.map((v,i)=>(v==='wet')!==p.water.includes(i)?i:-1).filter(i=>i>=0)}if(!ids.length){toast('すべてのマスが正しく埋まっています');return}const i=ids[0],want=p.water.includes(i)?'wet':'dry',r=Math.floor(i/N())+1,c=i%N()+1;history.push(states.slice());states[i]=want;mode=want;updateMode();bubble($('cell-'+i));sound(want==='wet');tactile();render();$('status').textContent=`ヒント：${r}行${c}列は${want==='wet'?'水を入れる':'×を付ける'}マスです。`};
$('next').onclick=()=>{level=(level+1)%puzzles.length;localStorage.setItem('pukupuku-level',String(level));build();window.scrollTo({top:0,behavior:'smooth'})};$('how').onclick=()=>showRules(false);$('closeModal').onclick=()=>$('overlay').classList.remove('open');$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')});$('sound').onclick=()=>{soundOn=!soundOn;localStorage.setItem('pukupuku-sound',soundOn?'on':'off');$('sound').textContent=soundOn?'♫':'♪̸';toast(soundOn?'音をオンにしました':'音をオフにしました');if(soundOn)sound(true)};$('sound').textContent=soundOn?'♫':'♪̸';build();
</script></body></html>
