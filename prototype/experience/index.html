<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぷくぷく水槽 — 5問の体験検証</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#174c64;background:#e8f9fb}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(170deg,#d9f7f5,#f5fbfc 58%,#d4edfc);padding:16px 12px 48px}
main{max-width:510px;margin:auto}.top{text-align:center}.top h1{font-size:26px;letter-spacing:.06em;margin:8px 0}.sub{font-size:12px;color:#547a86}
.card{background:#fffffff0;border:1px solid #c7e5eb;border-radius:22px;padding:17px 13px;box-shadow:0 12px 32px #34798b13;margin:14px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{font-weight:750;background:#e6f7f5;color:#236d76;padding:7px 11px;border-radius:99px;font-size:12px}
button{font:inherit;cursor:pointer;touch-action:manipulation}.modes,.actions,.choices{display:flex;gap:8px}.modes button,.actions button,.choices button{flex:1;min-height:44px;border-radius:12px;border:1px solid #a3d8e0;background:#f7ffff;color:#236c7c;font-weight:750;padding:8px}
.modes button.selected{background:#b6eef3;border-color:#168fa2;color:#145b6c}
.board-area{--n:5;--size:min(calc((100vw - 96px)/5),71px);width:fit-content;max-width:100%;margin:17px auto}
.clues-top{display:grid;grid-template-columns:repeat(var(--n),var(--size));margin-left:29px}.clues-left{display:flex;flex-direction:column}.clue{width:var(--size);height:28px;display:grid;place-items:center;font-weight:800;color:#285a70}.clues-left .clue{width:29px;height:var(--size)}.clue.met{color:#12835f}
.matrix{display:flex}.grid{display:grid;grid-template-columns:repeat(var(--n),var(--size));grid-template-rows:repeat(var(--n),var(--size));border-radius:8px;overflow:hidden;background:#b7d9df}
.cell{position:relative;display:grid;place-items:center;border:1px solid #cbdee1;padding:0;background:#f6fcfc;color:#809ca5;font-size:27px;font-weight:300;min-width:0;min-height:0;user-select:none}
.cell.water{color:#fff;background:linear-gradient(#8ee0ee,#2eafcf)}.cell.dry{background:#edf5f5}.cell.hinted{outline:3px solid #dfa45c;outline-offset:-5px;z-index:2}
.cell .bubble{position:absolute;pointer-events:none;border:2px solid #fff8;border-radius:50%;width:40%;height:40%;animation:pop .42s ease-out forwards}@keyframes pop{to{transform:translateY(-60%) scale(2.4);opacity:0}}
.note,.status{font-size:13px;color:#4b7581;line-height:1.65;margin:12px 0}.status{padding:11px 12px;background:#eaf7f7;border-radius:10px}
.hint{background:#eff9fa;border-left:4px solid #5db6c3;padding:11px;margin:9px 0;border-radius:7px;font-size:13px;line-height:1.7}.hint[hidden],.choices[hidden],.finish[hidden]{display:none}
.actions{margin-top:10px}.primary{background:#238ea3!important;color:white!important;border-color:#238ea3!important}.finish{font-size:14px;line-height:1.7;margin-top:12px;text-align:center}
.tiny{font-size:11px;color:#68868f}.rule{padding-left:19px;font-size:12px;line-height:1.8;color:#4b7380}
@media(max-width:390px){.board-area{--size:min(calc((100vw - 98px)/5),60px)}.card{padding:15px 11px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<main><header class="top"><h1>ぷくぷく水槽</h1><div class="sub">気づく → 自分で確定する → また気づく</div></header>
<section class="card">
<div class="bar"><span id="stage" class="pill"></span><span class="tiny" id="progress"></span></div>
<h2 id="headline" style="font-size:18px;margin:15px 0 13px"></h2>
<div class="modes"><button id="water" class="selected">≈ 水を入れる</button><button id="dry">× 入れない</button></div>
<div class="board-area" id="board-area"><div id="top" class="clues-top"></div><div class="matrix"><div id="left" class="clues-left"></div><div id="board" class="grid" aria-label="水槽パズル"></div></div></div>
<div class="tiny" style="text-align:center">太い線＝水槽の壁　・＝未確定　緑の数字＝水の個数が一致</div>
<div class="actions"><button id="undo">↶ 戻す</button><button id="hintBtn">ヒント</button><button id="restart">やり直す</button></div>
<div id="hint" class="hint" hidden></div><p id="status" class="status" aria-live="polite"></p>
<div id="choice" class="choices" hidden><button id="continue" class="primary">もう1問</button><button id="stop">今日はここまで</button></div>
<div id="finish" class="finish" hidden></div>
</section>
<section class="card"><b>水槽のルール</b><ol class="rule"><li>行と列の数字＝水が入るマス数</li><li>同じ水槽の同じ高さは全部水か全部×</li><li>各水槽の水は下の段からたまる</li></ol><div class="bar"><span class="tiny">入力方式・音・振動はブラウザ版では評価対象外です。</span><button id="skip" style="border:none;background:transparent;color:#0f889d;text-decoration:underline;font-size:12px">導入をスキップ</button></div></section>
</main>
<script>
(()=>{
"use strict";
const exercises=[
 {id:"intro-1",kind:"導入",title:"数字と入力の練習",regions:["ABC","ABC","ABC"],rows:[0,3,3],cols:[2,2,2]},
 {id:"intro-2",kind:"導入",title:"水面は同じ高さ",regions:["AAB","CCB","DDE"],rows:[0,1,3],cols:[1,1,2]},
 {id:"intro-3",kind:"導入",title:"下から水がたまる",regions:["AAB","ACB","DCC"],rows:[0,2,3],cols:[1,2,2]},
 {id:"main-1",kind:"本編",title:"はじめの気づき",regions:["ABBCC","ADBCC","ADDDE","FFDDE","FFGGG"],rows:[0,3,4,3,5],cols:[2,2,4,4,3]},
 {id:"main-2",kind:"本編",title:"別の形、同じルール",regions:["DDDCB","DDDCB","GDECB","GGEAA","FFEAA"],rows:[1,4,2,2,5],cols:[3,4,2,1,4]},
 {id:"main-3",kind:"本編",title:"小さな推理の連鎖",regions:["GGDDD","GGCCD","BCCCE","BBFAA","BBFFA"],rows:[0,4,3,2,2],cols:[3,4,2,2,0]},
 {id:"main-4",kind:"本編",title:"水槽の幅にも注目",regions:["AGGDD","AGDDD","BBFFF","EECFF","ECCCC"],rows:[5,5,2,1,4],cols:[3,4,4,3,3]},
 {id:"main-5",kind:"本編",title:"いつもの水槽",regions:["FFBBE","AGBEE","AACCD","AACDD","AACDD"],rows:[2,1,0,2,5],cols:[1,1,3,3,2]},
 {id:"bonus-1",kind:"追加",title:"もうひとつの水槽",regions:["AAAAE","AAABE","DDBBE","DDBBG","DDFFC"],rows:[1,4,1,3,2],cols:[3,3,1,0,4]}
];
const $=id=>document.getElementById(id),KEY="pukupuku-five-experience-v1";
let index=0,mode=1,marks=[],history=[],hintStage=-1,currentHint=null,observedChoice=false;
const n=p=>p.rows.length;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger(x.index)&&x.index>=0&&x.index<exercises.length){index=x.index;if(Array.isArray(x.marks)&&x.marks.length===n(exercises[index])**2&&x.marks.every(v=>[-1,0,1].includes(v)))marks=x.marks;observedChoice=!!x.observedChoice;}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({index,marks,observedChoice}));}catch(e){}}
function current(){return exercises[index]}
function region(p,r,c){return p.regions[r][c]}
function valid(p,answer){
 const size=n(p);if(answer.length!==size*size||answer.some(v=>v===-1))return false;
 for(let r=0;r<size;r++)if(p.rows[r]!==answer.slice(r*size,(r+1)*size).filter(v=>v===1).length)return false;
 for(let c=0;c<size;c++)if(p.cols[c]!==Array.from({length:size},(_,r)=>answer[r*size+c]).filter(v=>v===1).length)return false;
 for(const t of new Set(p.regions.join(""))){
  const byRow=new Map();
  for(let r=0;r<size;r++)for(let c=0;c<size;c++)if(region(p,r,c)===t){
   const val=answer[r*size+c];
   if(byRow.has(r)&&byRow.get(r)!==val)return false;
   byRow.set(r,val);
  }
  for(const [r,v] of byRow)for(const [lower,lv] of byRow)if(r<lower&&v===1&&lv===0)return false;
 }
 return true;
}
function counts(p,axis,i){let wet=0,unknown=0;for(let j=0;j<n(p);j++){let v=axis==="r"?marks[i*n(p)+j]:marks[j*n(p)+i];if(v===1)wet++;if(v===-1)unknown++;}return {wet,unknown,needed:(axis==="r"?p.rows:p.cols)[i]};}
function errors(p){
 const res=[];for(let i=0;i<n(p);i++)for(const axis of ["r","c"]){let t=counts(p,axis,i);if(t.wet>t.needed||t.wet+t.unknown<t.needed)res.push((axis==="r"?"行":"列")+(i+1));}
 for(let r=0;r<n(p);r++)for(let c=0;c<n(p);c++)for(let y=0;y<n(p);y++)for(let x=0;x<n(p);x++){
  if(region(p,r,c)!==region(p,y,x))continue;let a=marks[r*n(p)+c],b=marks[y*n(p)+x];if(a===-1||b===-1)continue;
  if((r===y&&a!==b)||(r<y&&a===1&&b===0))res.push("水槽"+region(p,r,c));
 }
 return [...new Set(res)];
}
function hintFor(p){
 const size=n(p);
 for(let i=0;i<size;i++)for(const axis of ["r","c"]){
  const q=counts(p,axis,i),remain=q.needed-q.wet;if(q.unknown>0&&(remain===0||remain===q.unknown)){
   const targets=[];for(let j=0;j<size;j++){const k=axis==="r"?i*size+j:j*size+i;if(marks[k]===-1)targets.push(k);}
   return {target:targets,where:(axis==="r"?"行":"列")+(i+1),why:"必要な水は"+q.needed+"マス。確定した水は"+q.wet+"マス、未確定は"+q.unknown+"マスです。",result:"未確定の"+targets.length+"マスは"+(remain===0?"すべて×":"すべて水")+"。"};
  }
 }
 for(let k=0;k<size*size;k++)if(marks[k]===-1){
  const r=Math.floor(k/size),c=k%size,t=region(p,r,c);
  for(let j=0;j<size*size;j++)if(marks[j]!==-1&&region(p,Math.floor(j/size),j%size)===t){
   const jr=Math.floor(j/size),v=marks[j];
   if(jr===r||(jr<r&&v===1)||(jr>r&&v===0)){
    return {target:[k],where:"水槽"+t+"の"+(r+1)+"行"+(c+1)+"列",why:jr===r?"同じ高さの水位は揃います。":"水は下からたまるため、上下の確定マスが手掛かりです。",result:(r+1)+"行"+(c+1)+"列は"+(v===1?"水":"×")+"。"};
   }
  }
 }
 return {target:[],where:"水槽と行・列の数字",why:"今見えている規則だけでは簡単な確定マスを発見できませんでした。",result:"別の水槽の幅と数字の残数を見比べてください。"};
}
function render(){
 const p=current(),size=n(p),done=valid(p,marks);$("board-area").style.setProperty("--n",size);
 $("board-area").style.setProperty("--size",size===3?"min(calc((100vw - 96px)/3),92px)":"min(calc((100vw - 96px)/5),71px)");
 $("stage").textContent=p.kind+" "+(index<3?index+1:index<=7?index-2:6)+"/"+(index<3?"3":index<=7?"5":"任意6");
 $("headline").textContent=p.title;$("progress").textContent=marks.filter(x=>x>=0).length+"/"+(size*size)+"マス";
 $("top").innerHTML="";$("left").innerHTML="";$("board").innerHTML="";
 for(let c=0;c<size;c++){let e=document.createElement("div");e.className="clue"+(counts(p,"c",c).wet===p.cols[c]?" met":"");e.textContent=p.cols[c];$("top").append(e);}
 for(let r=0;r<size;r++){let e=document.createElement("div");e.className="clue"+(counts(p,"r",r).wet===p.rows[r]?" met":"");e.textContent=p.rows[r];$("left").append(e);}
 for(let r=0;r<size;r++)for(let c=0;c<size;c++){
  const k=r*size+c,e=document.createElement("button"),t=region(p,r,c),val=marks[k];
  e.className="cell "+(val===1?"water":val===0?"dry":"");
  e.textContent=val===1?"≈":val===0?"×":"·";
  e.setAttribute("aria-label",(r+1)+"行"+(c+1)+"列、"+(val===1?"水":val===0?"乾燥":"未確定"));
  e.style.borderTopWidth=(r===0||region(p,r-1,c)!==t?"4px":"1px");
  e.style.borderBottomWidth=(r===size-1||region(p,r+1,c)!==t?"4px":"1px");
  e.style.borderLeftWidth=(c===0||region(p,r,c-1)!==t?"4px":"1px");
  e.style.borderRightWidth=(c===size-1||region(p,r,c+1)!==t?"4px":"1px");
  e.style.borderColor="#4e97a2";
  if(currentHint?.target.includes(k))e.classList.add("hinted");
  e.onclick=()=>{if(done)return;history.push([...marks]);marks[k]=marks[k]===mode?-1:mode;currentHint=null;hintStage=-1;$("hint").hidden=true;save();render();const a=$("board").children[k];if(!matchMedia("(prefers-reduced-motion: reduce)").matches){const b=document.createElement("span");b.className="bubble";a.append(b);setTimeout(()=>b.remove(),450);}};
  $("board").append(e);
 }
 $("water").classList.toggle("selected",mode===1);$("dry").classList.toggle("selected",mode===0);
 $("undo").disabled=history.length===0;
 const conflicts=errors(p);
 $("status").textContent=done?"クリア！ ここまでの気づきを振り返ってください。":conflicts.length?"確定した数字や水槽に矛盾の可能性："+conflicts[0]:"数字に合う水槽の高さを推理してください。";
 $("choice").hidden=!done;
 $("finish").hidden=true;
 $("skip").hidden=index>=3;
 if(done) {$("hintBtn").disabled=true;if(index===8){$("choice").hidden=true;$("finish").hidden=false;$("finish").textContent="追加の1問もクリアしました。ここで終了です。";}else if(index<7) {$("continue").textContent="次の問題へ";$("stop").textContent="今日はここまで";}else{$("continue").textContent="もう1問";$("stop").textContent="今日はここまで";}}
 else {$("hintBtn").disabled=false;}
}
function advance(){if(index>=exercises.length-1)return;index++;marks=Array(n(current())**2).fill(-1);history=[];currentHint=null;hintStage=-1;$("hint").hidden=true;save();render();}
$("water").onclick=()=>{mode=1;render()};$("dry").onclick=()=>{mode=0;render()};
$("undo").onclick=()=>{if(history.length){marks=history.pop();save();currentHint=null;hintStage=-1;$("hint").hidden=true;render();}};
$("restart").onclick=()=>{if(confirm("この問題を最初からやり直しますか？")){marks=Array(n(current())**2).fill(-1);history=[];save();render();}};
$("hintBtn").onclick=()=>{const p=current();if(!currentHint||hintStage>=2){currentHint=hintFor(p);hintStage=0;}else hintStage++;const h=currentHint;
 $("hint").innerHTML="<b>見る場所</b>："+h.where+(hintStage>=1?"<p><b>理由</b>："+h.why+"</p>":"")+(hintStage>=2?"<p><b>結論</b>："+h.result+"</p>":"");
 $("hint").hidden=false;render();
 $("hint").hidden=false;};
$("continue").onclick=()=>{if(index===7){observedChoice=true;save();}advance()};
$("stop").onclick=()=>{observedChoice=index===7?"stopped":observedChoice;save();$("choice").hidden=true;$("finish").hidden=false;$("finish").textContent="今日はここまで。続きはこのブラウザに保存しました。";};
$("skip").onclick=()=>{index=3;marks=Array(25).fill(-1);history=[];save();render()};
load();if(!marks.length)marks=Array(n(current())**2).fill(-1);render();
window.__pukupukuTest={exercises,valid};
})();
</script></body></html>
