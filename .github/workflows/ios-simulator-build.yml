name: iOS simulator build
on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator-build.yml"
  push:
    branches:
      - "codex/ios-vertical-slice-20261102"
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator-build.yml"
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build without signing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project PukupukuAquarium.xcodeproj \
            -scheme PukupukuAquarium \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
